version: "3.7"

services:
  app_proxy:
    image: getumbrel/app-proxy:v1.0.1
    environment:
      # The name format is <app-id>_<service-name>_1
      APP_HOST: cmoraes-electrum-wallet-gui_server_1
      # The Electrum noVNC container serves its web UI on 8080.
      APP_PORT: 8080
    restart: on-failure

  server:
    # Image that includes Electrum with a noVNC server (port 8080).
    image: beli/electrum:latest
    user: "0:0"
    environment:
      - VNC_PASSWD=money-printer-go-brrr   # Cambia esto por una contraseña segura
      - RESOLUTION=1280x720
    # Electrum stores its wallet in /root/.electrum, so we mount that path.
    volumes:
      - "${APP_DATA_DIR}/data:/root/.electrum"
    # Expose the HTTP port that noVNC serves on.
    expose:
      - "8080"
    restart: on-failure
    # init:true guarantees proper signal handling and avoids zombie processes.
    init: true
