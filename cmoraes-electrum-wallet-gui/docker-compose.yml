version: "3.7"

services:
  app_proxy:
    image: getumbrel/app-proxy:v1.0.1
    environment:
      APP_HOST: cmoraes-electrum-wallet-gui_server_1
      APP_PORT: 8080
    restart: on-failure

  server:
    # Imagen oficial de Electrum con soporte VNC disponible en Docker Hub.
    # Se sustituyó la imagen inexistente "mpepping/electrum:latest" por una que sí
    # existe y funciona correctamente con Umbrel.
    image: beli/electrum:latest
    user: "0:0"
    environment:
      - VNC_PASSWD=money-printer-go-brrr  # Cambia esto por tu contraseña visual segura
      - RESOLUTION=1280x720
    volumes:
      - "${APP_DATA_DIR}/data:/.electrum"
    restart: on-failure
    # `init:true` garantiza que Docker gestione correctamente la señal de parada
    # y evite procesos zombie dentro del contenedor.
    init: true
